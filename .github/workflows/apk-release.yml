name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-automix)'
        required: false
        default: 'v1.0.0-automix'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-apks:
    name: Build APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gms
            task: assembleGmsMobileUniversalRelease
          - flavor: foss
            task: assembleFossMobileUniversalRelease

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache for Native C++
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ matrix.flavor }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.flavor }}-
            ${{ runner.os }}-ccache-

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK (${{ matrix.flavor }})
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./gradlew "${{ matrix.task }}" \
            --build-cache \
            --parallel \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true \
            -Dorg.gradle.workers.max=4 \
            --stacktrace

      - name: Collect Release APK
        run: |
          mkdir -p release_artifacts
          find app/build/outputs/apk -type f -name "*release*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found APK: $apk -> $filename"
            cp "$apk" "release_artifacts/$filename"
          done
          ls -lh release_artifacts/

      - name: Upload Flavor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YumaPlayer-APK-${{ matrix.flavor }}
          path: release_artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-apks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Built APKs
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          pattern: YumaPlayer-APK-*
          merge-multiple: true

      - name: Generate Checksums
        id: checksums
        run: |
          cd release_artifacts
          ls -lh
          sha256sum *.apk > checksums.sha256 || true
          cat checksums.sha256
          cd ..

      - name: Determine Release Tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0-automix"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved Tag: $TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: "YumaPlayer ${{ steps.resolve_tag.outputs.tag }}"
          body: |
            ## YumaPlayer Autonomous Mixing Release (${{ steps.resolve_tag.outputs.tag }})

            ### 🚀 New Features & Enhancements
            - **Seamless AutoMix Engine**:
              - Dual-deck real-time transition automation powered by `DjFilterAudioProcessor`.
              - 200 Hz crossover low-shelf bass-swap filters preventing muddy low-end build-up.
              - Bar-snapped phrase boundary synchronization and dynamic Sonic tempo stretching.
            - **Musical Compatibility Engine**:
              - 6-factor weighted compatibility evaluation: BPM (25%), Phrase (20%), Instrument (20%), Harmonic Key (15%), Energy (10%), Vocal Clash (10%).
              - Circle-of-Fifths Camelot Wheel harmonic scoring (relative majors/minors, adjacent steps, energy boost transpositions).
            - **AI Stem Mashup Architecture**:
              - 4-stem separation support (Vocals, Drums, Bass, Accompaniment) with background LRU disk caching.
              - Common PCM Rendering Path with soft-knee peak limiting to eliminate inter-player clock drift.
              - Mashup Combinations: Vocal over Instrumental, Drum & Bass handoffs, and multi-track layer blending.
            - **Mix Preferences & Settings UI**:
              - Persistent user preferences via AndroidX DataStore.
              - Modern Jetpack Compose controls for mixing engine, mix style, harmonic matching, vocal clash guard, and resource constraints.

            ### 📦 Checksums & Integrity
            Verify downloaded APKs using the attached `checksums.sha256`.
          files: |
            release_artifacts/*.apk
            release_artifacts/checksums.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
